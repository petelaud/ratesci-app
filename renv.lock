      "Config/roxygen2/version": "8.1.0",
      "NeedsCompilation": "no",
      "Author": "Pete Laud [aut, cre] (ORCID: <https://orcid.org/0000-0002-3766-7090>)",
      "Maintainer": "Pete Laud <pete@sheffstat.co.uk>",
      "Repository": "CRAN"
    },
